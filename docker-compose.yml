# TILES in containers. Start it through the launcher rather than directly:
#
#   ./start.sh docker          (Windows: start.cmd docker)   app at :8000
#   ./start.sh docker --live   the same, with Chromium for live play
#
# Optional extra: `docker compose --profile telemetry up mlflow` runs an
# MLflow UI at :5000 (then set MLFLOW_TRACKING_URI below).

x-tiles: &tiles
  volumes:
    - tiles-db:/data
  ports:
    - "${TILES_API_PORT:-8000}:8000"
  environment:
    PYTHONUNBUFFERED: "1"
    # Passed through from your shell when set; enables the LLM Explainer.
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Uncomment to send ablation/tournament metrics to the mlflow service:
    # MLFLOW_TRACKING_URI: http://mlflow:5000
  restart: unless-stopped

services:
  tiles:
    <<: *tiles
    image: tiles:local
    build:
      context: .
      args:
        LIVE: "false"

  tiles-live:
    <<: *tiles
    profiles: ["live"]
    image: tiles:live
    build:
      context: .
      args:
        LIVE: "true"
    # Chromium in a container needs a bigger /dev/shm.
    shm_size: "1gb"

  mlflow:
    profiles: ["telemetry"]
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlruns
    restart: unless-stopped

volumes:
  tiles-db:
  mlflow-data:
