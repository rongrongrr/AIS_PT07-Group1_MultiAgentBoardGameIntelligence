<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TILES</title>
    <script>
      // Set the theme before the first paint so there is no dark flash for light-mode users.
      (function () {
        try {
          var p = localStorage.getItem("tiles_theme") || "dark";
          var light = p === "light" || (p === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
        } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
