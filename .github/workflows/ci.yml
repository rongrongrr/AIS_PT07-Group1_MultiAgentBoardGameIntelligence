name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e './backend[dev,rl]'
      - name: Test
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build (tsc + vite)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tiles:ci .
      - name: Smoke test
        run: |
          docker run -d --rm --name tiles-ci -p 8000:8000 tiles:ci
          for i in $(seq 1 20); do
            sleep 1
            curl -sf http://127.0.0.1:8000/api/health && break
          done
          curl -sf http://127.0.0.1:8000/api/tacticians | grep -q mcts_profiled
          docker stop tiles-ci
